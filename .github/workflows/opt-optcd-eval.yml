name: Modified jdk-compat
permissions: read-all
jobs:
  build:
    timeout-minutes: 10
    runs-on:
      - self-hosted
      - optcd
    strategy:
      matrix:
        java-version:
          - '25'
    steps:
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |-
          python -m pip install --upgrade pip
          pip install inotify
      - name: Run inotifywait
        run: |-
          python3 -c "
          import inotify.adapters
          import inotify.constants
          import os
          from datetime import datetime, timezone
          with open('/home/runner/inotifywait-log-build (${{ matrix.java-version }}).csv', 'w') as log_file:
            i = inotify.adapters.InotifyTree('/home/runner/work/karate/karate', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
            for event in i.event_gen(yield_nones=False):
              (_, type_names, path, filename) = event
              now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
              events = ','.join(type_names)
              log_file.write(f'{now};{path};{filename};{events}\n')
              log_file.flush()
              os.fsync(log_file.fileno())
          " &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: touch optcd-3.txt
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: touch optcd-4.txt
      - name: Build and test
        run: mvn -B clean verify -DdisableXmlReport=true -Dgatling.skip=true 
          -Dkarate.formats=json -Dkarate.options -Dkarate.output.html=false
      - run: touch optcd-5.txt
      - name: Upload inotifywait logs
        uses: actions/upload-artifact@v4
        with:
          name: inotifywait-build (${{ matrix.java-version }})
          path: /home/runner/inotifywait-log-build (${{ matrix.java-version 
            }}).csv
    name: build (${{ matrix.java-version }})
'on':
  - push
  - workflow_dispatch
